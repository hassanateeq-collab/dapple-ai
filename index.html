<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dapple AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ec;
    --paper: #fffdf8;
    --ink: #4a3220;
    --ink-soft: #8a6f52;
    --amber: #e8940f;
    --orange: #e2661c;
    --gold: #f5b942;
    --nova: #c47a08;
    --micro: #d95f1e;
    --years: #8a5a2b;
    --shadow: 0 6px 24px rgba(90, 60, 20, .12);
    --radius: 18px;

    /* font families toggled by body class */
    --font-fancy: "Fraunces", "Hoefler Text", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-plain: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --ui-font: var(--font-fancy);
  }
  body.font-plain { --ui-font: var(--font-plain); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 17.5px; }
  html, body { height: 100%; }
  body {
    font-family: var(--ui-font);
    background:
      radial-gradient(ellipse 900px 400px at 20% -5%, rgba(245, 185, 66, .18), transparent 60%),
      radial-gradient(ellipse 700px 350px at 85% -5%, rgba(226, 102, 28, .14), transparent 60%),
      var(--cream);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- leaf canopy (decorative top) ---------- */
  #canopy {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 110px;
    pointer-events: none;
    z-index: 60;
    overflow: visible;
  }
  .leaf {
    position: absolute;
    transform-origin: 50% 0%;
    animation: sway var(--dur, 4s) ease-in-out var(--delay, 0s) infinite alternate;
    filter: drop-shadow(0 3px 3px rgba(90, 50, 10, .18));
  }
  @keyframes sway {
    from { transform: translateY(var(--dip, 0px)) rotate(calc(var(--rot, 0deg) - 5deg)) scale(var(--scale, 1)); }
    to   { transform: translateY(var(--dip, 0px)) rotate(calc(var(--rot, 0deg) + 5deg)) scale(var(--scale, 1)); }
  }
  .faller {
    position: fixed;
    top: -70px;
    pointer-events: none;
    z-index: 55;
    animation: fall var(--fdur, 16s) linear var(--fdelay, 0s) infinite;
    opacity: .9;
  }
  @keyframes fall {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); }
    100% { transform: translate3d(var(--drift, 40px), 115vh, 0) rotate(680deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .leaf { animation: none; transform: translateY(var(--dip,0)) rotate(var(--rot,0)) scale(var(--scale,1)); }
    .faller { display: none; }
  }

  /* ---------- seasonal themes ---------- */
  /* autumn keeps the base warm background above; spring / summer / winter retint */
  body.season-spring {
    background:
      radial-gradient(ellipse 900px 420px at 25% -8%, rgba(150, 210, 120, .30), transparent 62%),
      radial-gradient(ellipse 700px 360px at 82% -6%, rgba(120, 200, 150, .22), transparent 60%),
      #f3faec;
  }
  body.season-summer {
    background:
      radial-gradient(circle 360px at 90% 1%, rgba(255, 214, 92, .60), transparent 62%),
      radial-gradient(ellipse 1100px 520px at 30% -10%, rgba(255, 238, 168, .42), transparent 62%),
      #fffef4;
  }
  body.season-winter {
    background:
      radial-gradient(ellipse 900px 420px at 25% -8%, rgba(180, 214, 240, .44), transparent 62%),
      radial-gradient(ellipse 700px 360px at 82% -6%, rgba(150, 190, 225, .32), transparent 60%),
      #eef4fb;
  }

  /* snowflakes reuse the .faller fall animation */
  .faller.snow { filter: drop-shadow(0 0 2px rgba(120, 160, 200, .55)); opacity: .95; }

  /* summer sun */
  #sun {
    position: fixed;
    top: -46px; right: 30px;
    width: 120px; height: 120px;
    pointer-events: none;
    z-index: 61;
  }
  #sun .sun-core {
    position: absolute; inset: 34px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff6d0, #ffdc6e 58%, #ffc63c);
    box-shadow: 0 0 40px 16px rgba(255, 205, 85, .6);
  }
  #sun .sun-rays {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 210, 90, .6) 0deg 5deg, transparent 5deg 16deg);
    -webkit-mask: radial-gradient(circle, transparent 26px, #000 30px, #000 54px, transparent 60px);
    mask: radial-gradient(circle, transparent 26px, #000 30px, #000 54px, transparent 60px);
    animation: sunspin 70s linear infinite;
  }
  @keyframes sunspin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #sun .sun-rays { animation: none; }
  }

  /* ---------- header ---------- */
  header {
    margin: 64px 18px 0;
    padding: 16px 26px 14px;
    background: linear-gradient(120deg, #a34d0a, #d97614 55%, #efa23b);
    border-radius: var(--radius);
    color: #fff8ec;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    position: relative;
    z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .leaf-mark { display: inline-flex; filter: drop-shadow(0 2px 2px rgba(70,35,0,.35)); }
  header h1 {
    font-size: 2rem;
    letter-spacing: .3px;
    font-weight: 800;
  }
  header .tagline {
    font-size: .95rem;
    opacity: .92;
    font-weight: 500;
    font-style: italic;
  }
  body.font-plain header .tagline { font-style: normal; }

  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .free-banner {
    background: rgba(255, 248, 230, .22);
    border: 1.5px dashed rgba(255, 248, 230, .75);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .4px;
  }

  /* ---------- segmented toggles (font + voice) ---------- */
  .seg-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 248, 230, .18);
    border: 1.5px solid rgba(255, 248, 230, .45);
    border-radius: 999px;
    padding: 3px;
  }
  .seg-toggle .ft-label {
    font-size: .7rem;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    opacity: .85;
    padding: 0 6px 0 8px;
  }
  .ft-btn {
    font: inherit;
    font-size: .78rem;
    font-weight: 700;
    color: #fff8ec;
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 4px 12px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .ft-btn[data-font="fancy"] { font-family: var(--font-fancy); }
  .ft-btn[data-font="plain"] { font-family: var(--font-plain); }
  .ft-btn.active {
    background: #fff8ec;
    color: #a34d0a;
    box-shadow: 0 1px 4px rgba(70, 35, 0, .25);
  }

  .fs-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: .78rem;
    font-weight: 700;
    color: #fff8ec;
    background: rgba(255, 248, 230, .18);
    border: 1.5px solid rgba(255, 248, 230, .55);
    border-radius: 999px;
    padding: 5px 13px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .fs-btn:hover { background: #fff8ec; color: #a34d0a; }
  .fs-btn svg { width: 15px; height: 15px; }

  /* ---------- layout ---------- */
  main {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 16px 18px 18px;
    min-height: 0;
    position: relative;
    z-index: 10;
  }
  aside {
    width: 265px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  aside .aside-title {
    font-size: .78rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-left: 4px;
  }

  .model-card {
    background: var(--paper);
    border: 2px solid #eadfce;
    border-radius: var(--radius);
    padding: 13px 15px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    color: inherit;
    box-shadow: 0 2px 8px rgba(90, 60, 20, .06);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position: relative;
  }
  .model-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .model-card.active { border-color: var(--mc, var(--amber)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc, var(--amber)) 25%, transparent), var(--shadow); }
  .model-card .row1 { display: flex; align-items: center; gap: 8px; }
  .model-card .m-name { font-weight: 800; font-size: 1.15rem; color: var(--mc, var(--ink)); }
  .badge-free {
    margin-left: auto;
    background: #e8f5e2;
    color: #3c7a2a;
    border: 1px solid #bfdfb2;
    font-size: .66rem;
    font-weight: 800;
    letter-spacing: .6px;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .ribbon {
    position: absolute;
    top: -10px;
    right: 14px;
    background: linear-gradient(120deg, var(--gold), var(--amber));
    color: #5b3a05;
    font-size: .62rem;
    font-weight: 900;
    letter-spacing: .8px;
    padding: 3px 9px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(120, 80, 10, .3);
  }
  .trait { color: var(--amber); font-size: .82rem; margin-top: 4px; font-weight: 600; }
  .m-blurb { font-size: .82rem; color: var(--ink-soft); margin-top: 5px; line-height: 1.4; }
  .m-rank { font-size: .74rem; font-weight: 700; margin-top: 6px; color: var(--mc, var(--ink)); }

  #modelList { display: flex; flex-direction: column; gap: 12px; }
  .topic-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-chip {
    font: inherit;
    font-size: .76rem;
    font-weight: 700;
    border: 1.5px solid #e3d7c3;
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .topic-chip:hover { border-color: var(--tc, var(--amber)); color: var(--tc, var(--ink)); }
  .topic-chip.active {
    background: var(--tc, var(--amber));
    border-color: var(--tc, var(--amber));
    color: #fff8ec;
  }

  /* ---------- chat ---------- */
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    background: var(--paper);
    border: 2px solid #eadfce;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .chat-head {
    padding: 10px 18px;
    border-bottom: 2px solid #f2e8d8;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .85rem;
    color: var(--ink-soft);
    background: #fffaf1;
  }
  .chat-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mc, var(--amber)); }
  .chat-head strong { color: var(--mc, var(--ink)); }
  .chat-head button {
    margin-left: auto;
    font: inherit;
    font-size: .75rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: none;
    border: 1.5px solid #e3d7c3;
    border-radius: 999px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .chat-head button:hover { background: #f7eedd; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .msg { max-width: 78%; line-height: 1.55; font-size: 1rem; animation: pop .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(120deg, #efa23b, #e2661c);
    color: #fff8ec;
    padding: 10px 16px;
    border-radius: 18px 18px 4px 18px;
    box-shadow: 0 3px 10px rgba(200, 110, 30, .25);
  }
  .msg.ai {
    align-self: flex-start;
    background: #fffdf8;
    border: 2px solid color-mix(in srgb, var(--mc, var(--amber)) 45%, #eadfce);
    padding: 10px 16px;
    border-radius: 18px 18px 18px 4px;
    box-shadow: 0 2px 8px rgba(90, 60, 20, .07);
  }
  .msg.ai .who {
    display: block;
    font-size: .68rem;
    font-weight: 800;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--mc, var(--amber));
    margin-bottom: 3px;
  }
  .msg.system {
    align-self: center;
    font-size: .75rem;
    color: var(--ink-soft);
    background: #f7eedd;
    padding: 4px 14px;
    border-radius: 999px;
  }
  .typing-dots { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--mc, var(--amber));
    opacity: .4;
    animation: blink 1.3s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .35; transform: none; } 35% { opacity: 1; transform: translateY(-2px); } }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    border-top: 2px solid #f2e8d8;
    background: #fffaf1;
  }
  #composer input {
    flex: 1;
    font: inherit;
    font-size: .98rem;
    padding: 11px 16px;
    border: 2px solid #e3d7c3;
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }
  #composer input:focus { border-color: var(--amber); }
  #composer button {
    font: inherit;
    font-weight: 800;
    font-size: .92rem;
    padding: 0 22px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--amber), var(--orange));
    color: #fff8ec;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(200, 110, 30, .3);
    transition: transform .12s ease;
  }
  #composer button:hover { transform: scale(1.03); }
  #composer button:disabled { opacity: .5; cursor: default; transform: none; }

  /* ---------- water footer ---------- */
  footer.water-zone {
    position: relative;
    height: 90px;
    flex-shrink: 0;
    overflow: hidden;
    z-index: 10;
  }
  footer .powered {
    position: absolute;
    left: 0; right: 0; top: 6px;
    text-align: center;
    font-size: .74rem;
    color: var(--ink-soft);
    letter-spacing: .3px;
    z-index: 3;
  }
  footer .powered strong { color: var(--amber); font-weight: 800; }
  #water {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: var(--wlevel, 60px);
    pointer-events: none;
    transition: height 1.1s cubic-bezier(.22, 1, .36, 1);
    z-index: 1;
  }
  #water .water-fill {
    position: absolute;
    left: 0; right: 0; bottom: 0; top: 11px;
    background: linear-gradient(180deg, rgba(96, 196, 224, .82), rgba(34, 128, 168, .92));
    box-shadow: inset 0 10px 22px rgba(255, 255, 255, .18);
  }
  #water .wave {
    position: absolute;
    left: 0; top: 0;
    width: calc(100% + 140px);
    height: 18px;
    background-repeat: repeat-x;
    background-size: 140px 18px;
  }
  #water .wave-back {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='18' viewBox='0 0 140 18'><path d='M0 9 Q 35 0 70 9 T 140 9 L140 18 L0 18 Z' fill='%237fd0e8'/></svg>");
    opacity: .75;
    animation: waveDrift 9s linear infinite;
  }
  #water .wave-front {
    top: 4px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='18' viewBox='0 0 140 18'><path d='M0 9 Q 35 18 70 9 T 140 9 L140 18 L0 18 Z' fill='%23268aac'/></svg>");
    animation: waveDrift 6s linear infinite reverse;
  }
  @keyframes waveDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-140px); }
  }

  /* wave layers bob up and down a little, like real chop */
  #water .wave-back { animation: waveDrift 9s linear infinite, waveBob 3.2s ease-in-out infinite alternate; }
  #water .wave-front { animation: waveDrift 6s linear infinite reverse, waveBob 2.3s ease-in-out .6s infinite alternate; }
  @keyframes waveBob {
    from { margin-top: 0; }
    to   { margin-top: 3px; }
  }

  /* splash droplets */
  .splash-drop {
    position: absolute;
    width: var(--sz, 6px);
    height: var(--sz, 6px);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: var(--sc, #7fd0e8);
    pointer-events: none;
    z-index: 2;
    animation: splashArc var(--sd, .9s) cubic-bezier(.2, .6, .6, 1) forwards;
  }
  @keyframes splashArc {
    0%   { transform: translate(0, 0) scale(1); opacity: .95; }
    45%  { transform: translate(calc(var(--dx, 0px) * .55), calc(var(--sh, 20px) * -1)) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx, 0px), 8px) scale(.6); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #water .wave { animation: none; }
    #water { transition: none; }
    .splash-drop { display: none; }
  }

  /* ---------- device layouts ---------- */
  /* LAPTOP (default): sidebar left, chat right — the base styles above. */

  /* TABLET: same side-by-side layout, narrower sidebar, bigger touch targets */
  body.device-tablet aside { width: 230px; }
  body.device-tablet .m-blurb { display: none; }
  body.device-tablet .topic-chip { padding: 8px 14px; font-size: .82rem; }
  body.device-tablet .model-card { padding: 12px 14px; }

  /* PHONE: chat-first. Slim header, modes as a 3-button row,
     topics as one scrollable strip — the chat gets the rest of the screen. */
  html:has(body.is-compact) { font-size: 16px; }
  body.is-compact #canopy { height: 44px; }
  body.is-compact header {
    margin: 26px 8px 0;
    padding: 8px 12px;
    gap: 6px;
    border-radius: 14px;
  }
  body.is-compact header h1 { font-size: 1.15rem; }
  body.is-compact header .tagline { display: none; }
  body.is-compact header .leaf-mark svg { width: 18px; height: 22px; }
  body.is-compact .header-right { gap: 6px; margin-left: auto; }
  body.is-compact .free-banner { display: none; }
  body.is-compact .seg-toggle { padding: 2px; }
  body.is-compact .seg-toggle .ft-label { display: none; }
  body.is-compact .ft-btn { font-size: .68rem; padding: 3px 8px; }
  body.is-compact .fs-btn .fs-label { display: none; }
  body.is-compact .fs-btn { padding: 4px 8px; }
  body.is-compact main { flex-direction: column; padding: 6px 8px 8px; gap: 6px; }
  body.is-compact aside { width: 100%; flex-direction: column; gap: 5px; max-height: none; overflow: visible; }
  body.is-compact aside .aside-title { display: none; }
  body.is-compact #modelList { display: flex; flex-direction: row; gap: 6px; }
  body.is-compact .model-card { flex: 1; min-width: 0; padding: 7px 10px; border-radius: 12px; text-align: center; }
  body.is-compact .model-card .row1 { justify-content: center; }
  body.is-compact .model-card .m-name { font-size: .95rem; }
  body.is-compact .model-card .badge-free,
  body.is-compact .model-card .ribbon,
  body.is-compact .trait,
  body.is-compact .m-blurb { display: none; }
  body.is-compact .m-rank { margin-top: 1px; font-size: .62rem; }
  body.is-compact .topic-list { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  body.is-compact .topic-list::-webkit-scrollbar { display: none; }
  body.is-compact .topic-chip { flex-shrink: 0; padding: 6px 12px; }
  body.is-compact .chat { min-height: 0; }
  body.is-compact .chat-head { padding: 7px 12px; font-size: .78rem; }
  body.is-compact #messages { padding: 12px 10px; gap: 10px; }
  body.is-compact .msg { max-width: 92%; font-size: .95rem; }
  body.is-compact form#composer { padding: 8px; }
  body.is-compact #composer input { padding: 10px 14px; }
  body.is-compact footer.water-zone { height: 46px; }
  body.is-compact footer .powered { top: 2px; font-size: .62rem; }

  /* water never overlaps the "powered" text on short footers */
  #water { height: min(var(--wlevel, 60px), calc(100% - 12px)); }

  /* ---------- device picker overlay ---------- */
  #devicePicker {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(74, 50, 32, .45);
    backdrop-filter: blur(4px);
    padding: 18px;
  }
  #devicePicker.hidden { display: none; }
  .dp-card {
    background: var(--paper);
    border: 2px solid #eadfce;
    border-radius: 22px;
    box-shadow: 0 18px 60px rgba(60, 35, 10, .35);
    padding: 26px 24px 22px;
    max-width: 430px;
    width: 100%;
    text-align: center;
  }

function escapeHTML(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function format(s) {
  return escapeHTML(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')

/* ---------- tiny math engine ---------- */
function tryMath(raw) {
  let t = raw.toLowerCase()
    .replace(/,/g, '')
    .replace(/(\d)\s*[x×]\s*(\d)/g, '$1*$2')
    .replace(/÷/g, '/')
    .replace(/\bplus\b/g, '+')
    .replace(/\bminus\b/g, '-')
    .replace(/\btimes\b|\bmultiplied by\b/g, '*')
    .replace(/\bdivided by\b|\bover\b/g, '/');
  const m = t.match(/[\d.()]+(?:\s*[-+*/^]\s*[\d.()]+)+/);
  if (!m) return null;
  let expr = m[0];
  if (!/\d/.test(expr) || !/[-+*/^]/.test(expr)) return null;
  const open = (expr.match(/\(/g) || []).length;
  const close = (expr.match(/\)/g) || []).length;
  if (open !== close) return null;
  const js = expr.replace(/\^/g, '**');
  if (!/^[\d.\s+\-*/()]*$/.test(js.replace(/\*\*/g, ''))) return null;
  try {
    const val = Function('"use strict"; return (' + js + ');')();
    if (typeof val === 'number' && isFinite(val)) {
      return { expr: expr.replace(/\s+/g, ' ').trim(), val: Math.round(val * 1e6) / 1e6 };
    }
  } catch (e) { /* not math after all */ }
  return null;
}

/* ---------- intent detection ---------- */
/* ---------- gibberish detection ---------- */
function looksLikeGibberish(text) {
  const words = text.toLowerCase().replace(/[^a-z\s']/g, ' ').split(/\s+/).filter(Boolean);
  if (!words.length) {
    // no letters at all (e.g. "00", "!!!", "…") — nothing to understand
    return text.trim().length > 0 && !/\d\s*[-+*/^]\s*\d/.test(text);
  }
  const gib = words.filter(w => {
    if (w.length < 4) return false;
    const vowels = (w.match(/[aeiouy]/g) || []).length;
    if (vowels === 0) return true;                                  // no vowels: "gvgfd"
    if (vowels / w.length < 0.2 && w.length >= 6) return true;      // barely any vowels: "gvgfgfdcre"
    if (/[bcdfghjklmnpqrstvwxz]{6,}/.test(w)) return true;          // long consonant run
    if (/(.)\1{3,}/.test(w)) return true;                           // "aaaa", "ffff"
    if (w.length >= 5 && (/^[asdfghjkl]+$/.test(w) || /^[qwertyuiop]+$/.test(w) || /^[zxcvbnm]+$/.test(w))) return true; // keyboard mash
    return false;
  });
  return gib.length > 0 && gib.length >= Math.ceil(words.length / 2);
}

function detectIntent(text) {
  const t = text.trim().toLowerCase();
  const math = tryMath(text);
  if (math) return { kind: 'math', math };
  const nameMatch = text.match(/(?:my name is|call me|i am called)\s+([a-z][a-z'-]*)/i);
  if (nameMatch) return { kind: 'name', name: nameMatch[1] };
  if (/^(hi|hii+|hello|hey|heya|yo|howdy|salaam|salam|assalamu.*|good (morning|afternoon|evening))\b/.test(t)) return { kind: 'greet' };
  if (/how are you|how('| a)?re you|how r u|hows it going|how's it going/.test(t)) return { kind: 'howru' };
  if (/who are you|what are you|your name|about yourself/.test(t)) return { kind: 'who' };
  if (/\bjoke\b|make me laugh|something funny/.test(t)) return { kind: 'joke' };
  if (/\bstory\b|once upon/.test(t)) return { kind: 'story' };
  if (/\briddle\b/.test(t)) return { kind: 'riddle' };
  if (/thank|thanks|thx|shukr/.test(t)) return { kind: 'thanks' };
  if (/^(bye|goodbye|good night|see you|gtg|cya)\b/.test(t)) return { kind: 'bye' };
  if (/what can you do|\bhelp\b|abilities|features/.test(t)) return { kind: 'help' };
  if (/best mode|which mode|best model|which model|\bnova\b|\bmicro\b|\byears\b/.test(t)) return { kind: 'models' };
  if (/favou?rite/.test(t)) return { kind: 'fav' };
  if (/what\s+(year|date|day|time)\s+is\s+it|what('|’)?s\s+the\s+(year|date|time|day)|today('|’)?s\s+date|current\s+(year|date|time)|which\s+year\s+(is\s+it|are\s+we)|what\s+day\s+is\s+(it|today)/.test(t)) return { kind: 'date' };
  if (looksLikeGibberish(text)) return { kind: 'gibberish' };
  if (/^(why|how|what|where|when|who|which|can|do|does|is|are|should)\b|\?$/.test(t)) return { kind: 'question' };
  return { kind: 'chat' };
}

/* ---------- shared bits ---------- */
function todayWords() {
  const now = new Date();
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return { day: DAYS[now.getDay()], date: now.getDate(), month: MONTHS[now.getMonth()], year: now.getFullYear(), time: now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) };
}
const topicOf = text => {
  const words = text.replace(/[^\w\s']/g, '').split(/\s+/).filter(w =>
    w.length > 3 && !/^(what|when|where|which|whats|does|about|your|with|that|this|have|from|will|would|could|should|there|their|really|please)$/i.test(w));
  return words.length ? words.slice(0, 3).join(' ') : 'that';
};

    years: 'You are Years, the oldest and wisest mode of Dapple AI. Speak calmly, like a kind grandparent, and give a helpful answer in at most 140 words.',
  }[modelKey];
  const now = new Date();
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let p = persona
    + ' Never use emojis. Use plain, friendly language a young person can follow.'
    + ' You may use **bold**, and for lists put each item on its own line.'
    + ` Important: today's real date is ${DAYS[now.getDay()]}, ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}, and the current year is ${now.getFullYear()}. This comes from the user's device clock and is correct — trust it over your training data, and never claim it is an earlier year.`;
  if (activeTopic !== 'general') {
    const t = TOPICS[activeTopic];
    p += ` The user has chosen the "${t.label}" topic filter, so keep every answer about ${t.label.toLowerCase()}. If they ask about something else, answer briefly and gently steer back to ${t.label.toLowerCase()}.`;
  }
  if (userName) p += ` The user's name is ${userName}.`;
  p += ' You are part of Dapple AI, which has three free modes: Nova (the best), Micro (the second best) and Years (the third best) — none of them are bad.';
  return p;
}

async function askAI(text, modelKey) {
  const messages = [
    { role: 'system', content: aiSystemPrompt(modelKey) },
    ...history.slice(-8),
    { role: 'user', content: text },
  ];
  let lastErr = null;
  for (const model of AI_MODELS) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 40000);
      const res = await fetch(AI_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer unused' },
        body: JSON.stringify({
          model,
          messages,
          max_tokens: modelKey === 'micro' ? 160 : 450,
          temperature: 0.7,
        }),
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const out = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if (!out || !out.trim()) throw new Error('empty reply');
      return stripEmojis(out).trim();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('AI unavailable');
}

const TOPIC_KEYS = Object.keys(TOPICS);

function modeTopicIntro(modelKey, topicKey) {
  const mName = MODELS[modelKey].name;
  if (topicKey === 'general') {
    return {
      nova: `${mName} here. I'll take my time and give you a careful answer. What can I help with?`,
      micro: `${mName} here. Second best, and quick. What do you need?`,
      years: `${mName} here. The third mode — slower, but glad to help. What shall we think about?`,
    }[modelKey];
  }
  return `${mName} here, now filtering for ${TOPICS[topicKey].label}. ${TOPICS[topicKey].introTail}`;
}

function topicReply(topicKey, modelKey, intent, text) {
  const t = TOPICS[topicKey];
  const engine = ENGINES[modelKey];
  const wantsRec = /\brecommend|suggest|any good|what should i|give me|\bideas?\b|\bbest\b|something to (watch|play|read|listen|study|do)|\bfact\b|\btip\b/i.test(text);
  switch (intent.kind) {
    case 'greet': return `Hello${nm()}. ${t.introTail}`;
    case 'help': return t.help();
    case 'thanks': return engine.thanks();
    case 'bye': return engine.bye();
    case 'howru': return engine.howru();
    case 'who': return `I'm **${MODELS[modelKey].name}**, and right now I'm filtering everything for **${t.label}**. ${t.introTail}`;
    case 'models': return engine.models();
    case 'gibberish': return engine.gibberish();
  }
  if (wantsRec) return t.recommend();
  if (intent.kind === 'question') return t.question(text);
  return t.chat(text);
}

async function generateReply(modelKey, text) {
  const engine = ENGINES[modelKey];
  const intent = detectIntent(text);
  if (intent.kind === 'name') {
    const n = intent.name.charAt(0).toUpperCase() + intent.name.slice(1).toLowerCase();
    userName = n;
    return engine.name(n);
  }
  if (intent.kind === 'gibberish') {
    return activeTopic !== 'general'
      ? topicReply(activeTopic, modelKey, intent, text)
      : engine.gibberish();
  }
  if (intent.kind === 'math') return engine.math(intent.math);
  if (intent.kind === 'date') return engine.date();   /* device clock — always right, any topic */

  /* quick scripted intents — instant and in-character */
  const scriptedKinds = ['greet', 'howru', 'who', 'joke', 'riddle', 'thanks', 'bye', 'help', 'models'];
  if (scriptedKinds.includes(intent.kind)) {
    return activeTopic !== 'general'
      ? topicReply(activeTopic, modelKey, intent, text)
      : engine[intent.kind]();
  }

  /* everything open-ended goes to the real AI brain */
  try {
    return await askAI(text, modelKey);
  } catch (e) {
    /* offline / AI down — fall back to the scripted replies */
    if (activeTopic !== 'general') return topicReply(activeTopic, modelKey, intent, text);
    switch (intent.kind) {
      case 'story': return engine.story();
      case 'fav': return engine.fav();
      case 'question': return engine.question(text);
      default: return engine.chat(text);
    }
  }
}

  return typeOut(body, text, MODELS[modelKey].typeSpeed);

function typeOut(body, text, speed) {
  return new Promise(resolve => {
    let i = 0;
    const tick = () => {
      i = Math.min(text.length, i + 1 + Math.floor(Math.random() * 2));
      body.innerHTML = format(text.slice(0, i));
      scrollDown();
      if (i < text.length) setTimeout(tick, speed);
      else resolve();
    };
    tick();
  });
}

/* ================= WATER LEVEL + SPLASHES ================= */
const WATER_MAX = 60, WATER_MIN = 14, WATER_STEP = 7;
let waterLevel = WATER_MAX;
function setWater(px) {
  waterLevel = Math.max(WATER_MIN, Math.min(WATER_MAX, px));
  document.documentElement.style.setProperty('--wlevel', waterLevel + 'px');
}
function waterDrop() {
  setWater(waterLevel - WATER_STEP);
  splash(8 + Math.random() * 84, 8);   /* a proper splash where the message "lands" */
}
function waterReset() { setWater(WATER_MAX); }

const SPLASH_COLORS = ['#eaf8fd', '#a9e0f2', '#7fd0e8', '#4db3d4', '#268aac'];
function splash(xPercent, count) {
  const zone = document.querySelector('footer.water-zone');
  if (!zone || document.hidden) return;
  const n = count || 4;
  for (let i = 0; i < n; i++) {
    const d = document.createElement('span');
    d.className = 'splash-drop';
    const size = 3 + Math.random() * 5;
    d.style.setProperty('--sz', size.toFixed(1) + 'px');
    d.style.setProperty('--sc', pick(SPLASH_COLORS));
    d.style.setProperty('--dx', (Math.random() * 44 - 22).toFixed(0) + 'px');
    d.style.setProperty('--sh', (10 + Math.random() * 20).toFixed(0) + 'px');
    d.style.setProperty('--sd', (0.6 + Math.random() * 0.5).toFixed(2) + 's');
    d.style.left = (xPercent + (Math.random() * 4 - 2)).toFixed(1) + '%';
    d.style.bottom = 'min(calc(var(--wlevel, 60px) - 6px), calc(100% - 14px))';
    d.addEventListener('animationend', () => d.remove());
    zone.appendChild(d);
  }
}
/* ambient splashing — the sea is never still */
setInterval(() => {
  if (!document.hidden) splash(Math.random() * 96, 2 + Math.floor(Math.random() * 3));
}, 1400 + Math.random() * 800);

/* ================= VOICE (text-to-speech) ================= */
const ttsSupported = typeof window !== 'undefined' && 'speechSynthesis' in window;
const synth = ttsSupported ? window.speechSynthesis : null;
let voiceOn = false;
const voiceBtns = document.querySelectorAll('[data-voice]');

/* Approximate ChatGPT's "Maple" — a warm, cheerful American female voice.
   The real Maple is an OpenAI cloud voice unavailable to the Web Speech API,
   so we pick the closest warm US-female voice the device offers. */
let chosenVoice = null;
const VOICE_PREFS = [
  // premium / natural US-female voices a Mac or browser may provide
  'Ava (Premium)', 'Ava (Enhanced)', 'Ava', 'Zoe (Premium)', 'Zoe',
  'Allison (Enhanced)', 'Allison', 'Samantha (Enhanced)',
  'Aria', 'Jenny', 'Emma', 'Google US English',
  // warm / natural macOS personas as fallbacks
  'Nicky', 'Sandy', 'Flo', 'Shelley', 'Kathy',
  // solid last resorts
  'Samantha', 'Karen', 'Serena',
];
function pickVoice(voices) {
  const enUS = voices.filter(v => /^en[-_]us$/i.test(v.lang));
  const en = voices.filter(v => /^en([-_]|$)/i.test(v.lang) || /english/i.test(v.name));
  for (const pref of VOICE_PREFS) {
    const p = pref.toLowerCase();
    const hit = enUS.find(v => v.name.toLowerCase().includes(p)) || en.find(v => v.name.toLowerCase().includes(p));
    if (hit) return hit;
  }
  return enUS[0] || en[0] || voices[0] || null;
}
function loadVoices() {
  if (!synth) return;
  const voices = synth.getVoices();
  if (voices.length) chosenVoice = pickVoice(voices);
}
if (synth) {
  loadVoices();
  synth.onvoiceschanged = loadVoices;
}

/* filler interjections to drop from spoken text — the "uh", not the "I think" */
const FILLERS = /(^|[\s(])(?:uh+|um+|umm+|er+|err+|erm+|ah+|ahh+|oh+|mm+|mmm+|hmm+|hmmm+)(?=[\s,.:;!?…—-]|$)/gi;
function cleanForSpeech(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '$1')   // strip bold markers
    .replace(/\*(.+?)\*/g, '$1')       // strip italic markers
    .replace(/•/g, '')                 // drop bullet glyphs
    .replace(FILLERS, '$1')            // remove filler sounds, keep real words like "I think"
    .replace(/^[\s,.:;…—-]+/, '')      // tidy any leftover leading punctuation
    .replace(/\s+([,.:;!?…])/g, '$1')  // no space before punctuation
    .replace(/([,.:;!?…])\s*[,.:;]+/g, '$1')  // collapse punctuation left behind by a removed filler
    .replace(/\s{2,}/g, ' ')
    .trim();
}
function speak(text) {
  if (!voiceOn || !synth) return;
  const clean = cleanForSpeech(text);
  if (!clean) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  if (chosenVoice) u.voice = chosenVoice;
  u.rate = 1.0;   // natural, conversational pace
  u.pitch = 1.1;  // bright and cheerful, Maple-like
  synth.speak(u);
}
function setVoice(on) {
  voiceOn = !!on && ttsSupported;
  voiceBtns.forEach(b => b.classList.toggle('active', b.dataset.voice === (voiceOn ? 'on' : 'off')));
  if (!voiceOn && synth) synth.cancel();
  try { localStorage.setItem('dapple-voice', voiceOn ? 'on' : 'off'); } catch (e) { /* ignore */ }
}
if (!ttsSupported) {
  const vt = document.getElementById('voiceToggle');
  if (vt) vt.style.display = 'none';
} else {
  voiceBtns.forEach(b => b.addEventListener('click', () => setVoice(b.dataset.voice === 'on')));
}

/* ================= SEND ================= */
async function handleSend(e) {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  addUser(text);

  const modelKey = activeModel;
  const m = MODELS[modelKey];

  const bubble = aiBubble(modelKey);
  const body = bubble.querySelector('.body');
  body.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  scrollDown();

  /* think (AI fetch or scripted) while the persona pause runs */
  const wait = m.delay[0] + Math.random() * (m.delay[1] - m.delay[0]);
  const [reply] = await Promise.all([
    generateReply(modelKey, text),
    new Promise(r => setTimeout(r, wait)),
  ]);

  history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
  if (history.length > 16) history = history.slice(-16);

  speak(reply);
  await typeOut(body, reply, m.typeSpeed);

  busy = false;
  sendBtn.disabled = false;
  inputEl.focus();
}

document.getElementById('composer').addEventListener('submit', handleSend);
document.getElementById('clearBtn').addEventListener('click', () => {
  if (busy) return;
  if (synth) synth.cancel();
  messagesEl.innerHTML = '';
  history = [];
  welcome();
  waterReset();
});

/* ================= FONT TOGGLE ================= */
function setFont(f) {
  const choice = f === 'plain' ? 'plain' : 'fancy';
  document.body.classList.remove('font-fancy', 'font-plain');
  document.body.classList.add('font-' + choice);
  document.querySelectorAll('[data-font]').forEach(b =>
    b.classList.toggle('active', b.dataset.font === choice));
  try { localStorage.setItem('dapple-font', choice); } catch (e) { /* ignore */ }
}
document.querySelectorAll('[data-font]').forEach(b =>
  b.addEventListener('click', () => setFont(b.dataset.font)));

/* ================= DEVICE LAYOUT ================= */
const DEVICE_KEY = 'dapple-device';
const DEVICE_LABELS = { phone: 'Phone', tablet: 'iPad', laptop: 'Laptop' };
function detectDevice() {
  const touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (touch && window.innerWidth < 700) return 'phone';
  if (touch) return 'tablet';
  return 'laptop';
}
function updateCompact() {
  /* compact layout: always on phone; on laptop/iPad only when the window is too narrow for the sidebar */
  const phone = document.body.classList.contains('device-phone');
  document.body.classList.toggle('is-compact', phone || window.innerWidth < 720);
}
function applyDevice(d, replant) {
  if (!DEVICE_LABELS[d]) d = 'laptop';
  document.body.classList.remove('device-phone', 'device-tablet', 'device-laptop');
  document.body.classList.add('device-' + d);
  updateCompact();
  const lbl = document.getElementById('deviceBtnLabel');
  if (lbl) lbl.textContent = DEVICE_LABELS[d];
  if (replant && typeof plantScene === 'function') plantScene();
}
function chooseDevice(d) {
  applyDevice(d, true);
  try { localStorage.setItem(DEVICE_KEY, d); } catch (e) { /* ignore */ }
  document.getElementById('devicePicker').classList.add('hidden');
}
function openDevicePicker() {
  const suggested = detectDevice();
  document.querySelectorAll('.dp-btn').forEach(b => {
    const isSug = b.dataset.device === suggested;
    b.classList.toggle('suggested', isSug);
    b.querySelector('.dp-suggested').hidden = !isSug;
  });
  document.getElementById('devicePicker').classList.remove('hidden');
}
document.querySelectorAll('.dp-btn').forEach(b =>
  b.addEventListener('click', () => chooseDevice(b.dataset.device)));
document.getElementById('deviceBtn').addEventListener('click', openDevicePicker);

/* ================= FULL SCREEN ================= */
const fullscreenBtn = document.getElementById('fullscreenBtn');
function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
function updateFsLabel() {
  const label = fullscreenBtn && fullscreenBtn.querySelector('.fs-label');
  if (label) label.textContent = fsElement() ? 'Exit full screen' : 'Full screen';
}
function toggleFullscreen() {
  const el = document.documentElement;
  if (!fsElement()) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const p = req.call(el); if (p && p.catch) p.catch(() => {}); }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); }
  }
}
if (fullscreenBtn) {
  if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) {
    fullscreenBtn.style.display = 'none';
  } else {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFsLabel);
    document.addEventListener('webkitfullscreenchange', updateFsLabel);
  }
}

function welcome() {
  addSystem('Welcome to Dapple AI — every mode is free');
  addAI(
    'Welcome to **Dapple AI**. I\'m **Nova**, the main mode here, and free to use. Ask me anything — football, cooking, YouTube, trends, homework, whatever you like. Switch between **Nova**, **Micro**, and **Years** for the tone, and pick a **topic filter** to keep me on one subject. There\'s also a **Voice** option up top. Everything is free.',
    'nova',
    true
  );
}

/* ================= SEASON + SCENE ================= */
function getSeason(date) {
  const m = (date || new Date()).getMonth(); // 0 = Jan (Northern Hemisphere)
  if (m >= 2 && m <= 4) return 'spring';      // Mar–May
  if (m >= 5 && m <= 7) return 'summer';      // Jun–Aug
  if (m >= 8 && m <= 10) return 'autumn';     // Sep–Nov
  return 'winter';                            // Dec–Feb
}
function resolveSeason() {
  try {
    const p = new URLSearchParams(location.search).get('season');
    if (p && ['spring', 'summer', 'autumn', 'winter'].includes(p)) return p;
  } catch (e) { /* ignore */ }
  return getSeason();
}
const SEASON = resolveSeason();

const LEAF_PALETTES = {
  autumn: ['#e2661c', '#e8940f', '#f5b942', '#d9541e', '#f0a83a', '#c9490f', '#ffcf5c', '#e07b1a', '#f6c04e', '#dd6f13'],
  spring: ['#8fd35a', '#7cbf4f', '#a4d96b', '#6bbf59', '#9ccc65', '#7fc97f', '#95d16a', '#68b246', '#b3e08a', '#7ec850'],
  summer: ['#3f8f38', '#4a9e3f', '#5cae4a', '#469a3e', '#59a94b', '#3d8a4f', '#4f9e45', '#57a83c'],
};
const SEASON_TAGLINE = {
  spring: 'A friendly AI among the fresh spring leaves',
  summer: 'A friendly AI out in the summer sun',
  autumn: 'A friendly AI beneath the autumn leaves',
  winter: 'A friendly AI out in the winter snow',
};

function leafSVG(color, size) {
  const vein = 'rgba(50,45,12,.30)';
  return `<svg width="${size}" height="${size * 1.25}" viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 1 C33 9 39 24 20 46 C1 24 7 9 20 1 Z" fill="${color}"/>
    <path d="M20 4 L20 43 M20 14 L28 20 M20 14 L12 20 M20 25 L29 32 M20 25 L11 32" stroke="${vein}" stroke-width="1.4" fill="none"/>
  </svg>`;
}
function snowflakeSVG(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#f2f9ff" stroke-width="1.5" stroke-linecap="round" fill="none">
      <path d="M12 2V22M2 12H22M4.9 4.9L19.1 19.1M19.1 4.9L4.9 19.1"/>
      <path d="M12 6l2.2 2M12 6l-2.2 2M12 18l2.2-2M12 18l-2.2-2M6 12l2 2.2M6 12l2-2.2M18 12l-2 2.2M18 12l-2-2.2"/>
    </g>
  </svg>`;
}

function canopyLeaves(palette, density) {
  const phone = document.body.classList.contains('is-compact');
  const count = Math.max(16, Math.floor((window.innerWidth / (phone ? 20 : 26)) * (density || 1)));
  let html = '';
  for (let i = 0; i < count; i++) {
    const color = pick(palette);
    const size = phone ? 12 + Math.random() * 14 : 22 + Math.random() * 26;
    const left = (i / count) * 100 + (Math.random() * 2.4 - 1.2);
    const dip = -14 + Math.random() * 46;
    const rot = 120 + Math.random() * 120; /* hang downward-ish */
    const dur = (4 + Math.random() * 3).toFixed(2);
    const delay = (-Math.random() * 6).toFixed(2);
    const scale = (0.8 + Math.random() * 0.5).toFixed(2);
    html += `<div class="leaf" style="left:${left.toFixed(2)}%; top:-6px; --dip:${dip.toFixed(0)}px; --rot:${rot.toFixed(0)}deg; --dur:${dur}s; --delay:${delay}s; --scale:${scale};">${leafSVG(color, size)}</div>`;
  }
  return html;
}
function plantFallingLeaves(palette) {
  let fallers = '';
  for (let i = 0; i < 7; i++) {
    const color = pick(palette);
    const size = 16 + Math.random() * 16;
    const left = Math.random() * 96;
    const fdur = (14 + Math.random() * 14).toFixed(2);
    const fdelay = (-Math.random() * 24).toFixed(2);
    const drift = (Math.random() * 160 - 80).toFixed(0);
    fallers += `<div class="faller" style="left:${left.toFixed(1)}%; --fdur:${fdur}s; --fdelay:${fdelay}s; --drift:${drift}px;">${leafSVG(color, size)}</div>`;
  }
  document.body.insertAdjacentHTML('beforeend', fallers);
}
function plantSnow() {
  let flakes = '';
  for (let i = 0; i < 30; i++) {
    const size = 8 + Math.random() * 16;
    const left = Math.random() * 98;
    const fdur = (9 + Math.random() * 12).toFixed(2);
    const fdelay = (-Math.random() * 20).toFixed(2);
    const drift = (Math.random() * 130 - 65).toFixed(0);
    flakes += `<div class="faller snow" style="left:${left.toFixed(1)}%; --fdur:${fdur}s; --fdelay:${fdelay}s; --drift:${drift}px;">${snowflakeSVG(size)}</div>`;
  }
  document.body.insertAdjacentHTML('beforeend', flakes);
}

function plantScene() {
  const canopy = document.getElementById('canopy');
  canopy.innerHTML = '';
  document.querySelectorAll('.faller, #sun').forEach(el => el.remove());

  if (SEASON === 'winter') {           // snowflakes, bare canopy
    plantSnow();
    return;
  }
  if (SEASON === 'summer') {           // sun + sparse green canopy, nothing falling
    document.body.insertAdjacentHTML('beforeend',
      '<div id="sun" aria-hidden="true"><div class="sun-rays"></div><div class="sun-core"></div></div>');
    canopy.innerHTML = canopyLeaves(LEAF_PALETTES.summer, 0.45);
    return;
  }
  if (SEASON === 'spring') {           // green canopy, nothing falling
    canopy.innerHTML = canopyLeaves(LEAF_PALETTES.spring, 1);
    return;
  }
  // autumn — original: orange/yellow canopy + falling leaves
  canopy.innerHTML = canopyLeaves(LEAF_PALETTES.autumn, 1);
  plantFallingLeaves(LEAF_PALETTES.autumn);
}

/* ================= INIT ================= */
try {
  const savedFont = localStorage.getItem('dapple-font');
  if (savedFont === 'plain' || savedFont === 'fancy') setFont(savedFont);
} catch (e) { /* ignore */ }
try {
  const savedVoice = localStorage.getItem('dapple-voice');
  if (savedVoice === 'on') setVoice(true);
} catch (e) { /* ignore */ }

document.body.classList.add('season-' + SEASON);
const taglineEl = document.querySelector('.tagline');
if (taglineEl) taglineEl.textContent = SEASON_TAGLINE[SEASON];
let savedDevice = null;
try { savedDevice = localStorage.getItem(DEVICE_KEY); } catch (e) { /* ignore */ }
if (savedDevice && DEVICE_LABELS[savedDevice]) {
  applyDevice(savedDevice, false);
} else {
  applyDevice(detectDevice(), false);   /* sensible layout behind the picker */
  openDevicePicker();
}
buildModelCards();
buildTopicChips();
chatPanel.style.setProperty('--mc', MODELS[activeModel].color);
plantScene();
welcome();
waterReset();
inputEl.focus();
let resizeTimer;
window.addEventListener('resize', () => {
  updateCompact();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(plantScene, 300);
});
</script>
</body>
